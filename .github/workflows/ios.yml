name: App iPhone

on:
  push:
    branches: [main, claude/ios-native]
    paths: ["ios/**", "!ios/**/*.md", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Compila l'app e prepara l'IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          xcodebuild -version

      - name: Genera il progetto
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test della logica (simulatore)
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project QuoteAbbonamenti.xcodeproj -scheme QuoteAbbonamenti -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Foto dello schermo (iPhone 14 e iPhone 16 Pro Max)
        working-directory: ios
        continue-on-error: true
        run: |
          set -e
          xcodebuild build -project QuoteAbbonamenti.xcodeproj -scheme QuoteAbbonamenti -sdk iphonesimulator -configuration Debug \
            -derivedDataPath DD -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO -quiet
          APP=DD/Build/Products/Debug-iphonesimulator/QuoteAbbonamenti.app
          RT=$(xcrun simctl list runtimes -j | python3 -c "import json,sys; r=[x for x in json.load(sys.stdin)['runtimes'] if x['isAvailable'] and x['platform']=='iOS']; print(r[-1]['identifier'])")
          mkdir -p shots
          for DEV in iPhone-14 iPhone-16-Pro-Max; do
            UDID=$(xcrun simctl create "Foto $DEV" "com.apple.CoreSimulator.SimDeviceType.$DEV" "$RT")
            xcrun simctl boot "$UDID"; xcrun simctl bootstatus "$UDID" -b > /dev/null
            xcrun simctl status_bar "$UDID" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 || true
            xcrun simctl install "$UDID" "$APP"
            shot() { xcrun simctl launch --terminate-running-process "$UDID" ch.quoteabbonamenti.app "$@" > /dev/null; }
            for TAB in mese abbonamenti statistiche promemoria impostazioni; do shot -demo -tab $TAB; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$DEV-$TAB.png"; done
            shot -demo -tab promemoria -remNext; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$DEV-promemoria-mese-dopo.png"
            shot -demo -tab promemoria -remPrev; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$DEV-promemoria-mesi-prima.png"
            for TH in stelle sakura; do shot -demo -tab mese -theme $TH; sleep 6; xcrun simctl io "$UDID" screenshot "shots/$DEV-$TH.png"; done
            shot -demo -intro; sleep 2; xcrun simctl io "$UDID" screenshot "shots/$DEV-intro.png"
            xcrun simctl shutdown "$UDID"
          done
          ls shots

      - name: Compila per iPhone (senza firma)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project QuoteAbbonamenti.xcodeproj -scheme QuoteAbbonamenti -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build.log | xcbeautify --renderer github-actions
          mkdir -p Payload
          cp -R build/Release-iphoneos/QuoteAbbonamenti.app Payload/
          zip -qry QuoteAbbonamenti.ipa Payload
          ls -la QuoteAbbonamenti.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: QuoteAbbonamenti-ipa
          path: ios/QuoteAbbonamenti.ipa

      - name: Pubblica l'IPA (release "iphone")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone ios/QuoteAbbonamenti.ipa --title "App iPhone (build ${{ github.run_number }})" \
            --notes "App nativa per iPhone, da installare con Sideloadly o AltStore. Compilata da ${{ github.sha }}." --latest=false

      - name: Pubblica le foto (release "iphone-foto")
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone-foto --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone-foto ios/shots/*.png --title "Foto dell'app iPhone (build ${{ github.run_number }})" --notes "Foto automatiche dal simulatore." --latest=false

      - name: Log (in caso di errore)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-log
          path: |
            ios/test.log
            ios/build.log
