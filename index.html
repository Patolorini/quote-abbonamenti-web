<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Quote Abbonamenti</title>
<meta name="description" content="Dividi gli abbonamenti con amici e famiglia: chi deve pagare, quanto e quando.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Quote">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EAF2F0" id="themeColor">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Una sola schermata: titolo in alto, contenuto che scorre, barra delle schede in basso. Fogli a schermo intero per le modifiche. */
:root {
  --bg: #eaf2f0; --cell: #ffffff; --fg: #14201e; --ink2: #6f7c79; --sep: #dcdfe0;
  --accent: #0f8a7a; --accent-soft: #d8efeb; --on-accent: #ffffff;
  --late: #d7372f; --ok: #1f9d5c; --warn: #b4540a; --switch-off: #e3e3e8; --banner: rgb(245 245 247 / .96);
  --f: system-ui, -apple-system, "Roboto", "Segoe UI", sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent }
html, body { margin: 0; height: 100%; overflow: hidden; -webkit-text-size-adjust: 100%; background: var(--bg); color: var(--fg); font-family: var(--f); font-size: 15px; line-height: 1.4 }
button, input, select { font: inherit; color: inherit }
[hidden] { display: none !important }
.num { font-variant-numeric: tabular-nums }

#app { position: fixed; inset: 0; display: flex; flex-direction: column }
.top { padding: calc(14px + env(safe-area-inset-top, 0px)) var(--sr) 4px var(--sl); display: flex; align-items: center; gap: 8px; flex: none }
.top h1 { font-size: 1.8rem; font-weight: 800; margin: 0; flex: 1; min-width: 0; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.iconbtn { border: 0; background: none; color: var(--accent); font-size: 1rem; padding: 8px 6px; cursor: pointer; border-radius: 8px; white-space: nowrap }
.iconbtn.big { font-size: 1.7rem; line-height: 1; padding: 2px 8px }
.view { flex: 1; overflow-y: auto; padding: 4px var(--sr) 24px var(--sl); overscroll-behavior: contain; display: flex; flex-direction: column; gap: 6px; -webkit-overflow-scrolling: touch }
.view > * { flex-shrink: 0 }
.sechead { font-size: .78rem; text-transform: uppercase; color: var(--ink2); padding: 14px 16px 6px; letter-spacing: .02em; display: flex; justify-content: space-between; gap: 8px }
.sechead .st { text-transform: none; letter-spacing: 0; font-weight: 600 }
.secfoot { font-size: .8rem; color: var(--ink2); padding: 6px 16px 4px }
.group { background: var(--cell); border-radius: 12px; overflow: hidden }
.row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; position: relative; min-height: 46px }
.row + .row::before, .row + .acts::before, .acts + .row::before { content: ""; position: absolute; top: 0; left: 16px; right: 0; border-top: 0.5px solid var(--sep) }
.row .grow { flex: 1; min-width: 0 }
.sub { font-size: .8rem; color: var(--ink2) }
.sub.late, .st.late { color: var(--late) } .sub.ok, .st.ok { color: var(--ok) } .st.due, .change { color: var(--warn) }
.change { font-size: .74rem; font-weight: 600 }
.tap { cursor: pointer }
.row.off .grow { opacity: .45 }
.link { color: var(--accent) }
.danger { color: var(--late) }
.empty { text-align: center; padding: 28px 16px; color: var(--ink2); display: flex; flex-direction: column; gap: 12px; align-items: center }
.empty b { color: var(--fg); font-size: 1.05rem }
.btn { border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; padding: 12px 18px; cursor: pointer }
.btn.ghost { background: var(--accent-soft); color: var(--accent) }
.hint { background: var(--accent-soft); color: var(--fg); border-radius: 12px; padding: 12px 14px; font-size: .86rem; display: flex; gap: 10px; align-items: flex-start }
.hint b { color: var(--accent) }
.hint button { border: 0; background: none; color: var(--ink2); font-size: 1rem; cursor: pointer; padding: 0 2px; margin-left: auto }

/* switch e controlli */
.switch { appearance: none; -webkit-appearance: none; width: 51px; height: 31px; border-radius: 16px; background: var(--switch-off); position: relative; cursor: pointer; flex: none; transition: background .2s; margin: 0 }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 2px 4px rgb(0 0 0 / .25); transition: transform .2s }
.switch:checked { background: var(--accent) }
.switch:checked::after { transform: translateX(20px) }
.seg { display: flex; flex: 1; background: var(--bg); border-radius: 9px; padding: 2px; min-width: 0 }
.seg button { flex: 1; min-width: 0; border: 0; background: transparent; font-size: .82rem; padding: 7px 2px; border-radius: 7px; cursor: pointer }
.seg button.sel { background: var(--cell); box-shadow: 0 1px 3px rgb(0 0 0 / .18); font-weight: 700 }
.seg button:disabled { opacity: .4 }
.in { border: 0; background: transparent; outline: none; min-width: 0; text-align: right; flex: 1 }
.in.left { text-align: left }
.in::placeholder { color: var(--ink2) }
select.in { appearance: none; -webkit-appearance: none; text-align-last: right; color: var(--accent) }
.box { border: 1px solid var(--sep); border-radius: 8px; padding: 6px 8px; background: var(--bg) }
.chip { border: 0; border-radius: 999px; background: var(--bg); padding: 6px 11px; font-size: .82rem; cursor: pointer }
.chip.sel { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
.chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 16px 12px }
.stepper { display: flex; align-items: center; gap: 4px; background: var(--bg); border-radius: 9px; padding: 2px; flex: none }
.stepper button { border: 0; background: var(--cell); width: 34px; height: 30px; border-radius: 7px; font-size: 1.1rem; cursor: pointer }
.stepper span { min-width: 30px; text-align: center; font-weight: 700 }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* tile categorie */
.tile { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; color: #fff }
.tile svg, .tabbar svg { width: 19px; height: 19px }
.ico { fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round }
.ico .f { fill: currentColor; stroke: none }
.cats { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; padding: 12px }
.cat { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: .72rem; cursor: pointer; padding: 6px 2px; border-radius: 12px }
.cat .tile { width: 42px; height: 42px; border-radius: 11px }
.cat .tile svg { width: 24px; height: 24px }
.tile.art { overflow: hidden; isolation: isolate; -webkit-mask-image: -webkit-radial-gradient(white, black) }
.tile.art svg, .cat .tile.art svg { width: 100%; height: 100%; display: block }
.cat.sel { box-shadow: 0 0 0 2px var(--accent); font-weight: 700 }

/* questo mese */
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; padding: 12px 16px 8px }
.stats div { display: flex; flex-direction: column; min-width: 0 }
.stats small { font-size: .72rem; color: var(--ink2) }
.stats b { font-size: .95rem; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.bar { height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; margin: 0 16px 12px }
.bar i { display: block; height: 100%; background: var(--ok) }
.pastdrop { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-top: 0.5px solid var(--sep); background: none; padding: 12px 16px; text-align: left; color: var(--late); font-weight: 700; cursor: pointer }
.pastdrop .grow { flex: 1; min-width: 0 }
.pastdrop .amt { font-weight: 700 }
.pastdrop .chev { font-size: 1.3rem; line-height: 1; transition: transform .2s; color: var(--ink2) }
.pastdrop.open .chev { transform: rotate(90deg) }
.latebar { padding: 0 16px 12px; font-size: .85rem; font-weight: 700; color: var(--late) }
.ck { width: 26px; height: 26px; border-radius: 50%; border: 1.5px solid var(--sep); background: transparent; display: grid; place-items: center; color: #fff; cursor: pointer; flex: none; font-size: .85rem; padding: 0 }
.ck.on { background: var(--ok); border-color: var(--ok) }
.amt { font-variant-numeric: tabular-nums; flex: none }
.amt.paid { color: var(--ink2) }
.paidname { text-decoration: line-through; color: var(--ink2) }
.acts { display: flex; gap: 8px; padding: 10px 16px; position: relative }
.act { flex: 1; text-align: center; border-radius: 10px; background: var(--accent-soft); color: var(--accent); padding: 9px 4px; font-size: .85rem; font-weight: 700; border: 0; cursor: pointer }
.per { display: block; font-size: .7rem; color: var(--ink2); text-align: right }

/* calendario */
.cal { padding: 10px 10px 12px; display: flex; flex-direction: column; gap: 6px }
.calhead { display: flex; align-items: center; justify-content: space-between; padding: 0 4px }
.calhead button { border: 0; background: none; color: var(--accent); font-size: 1.3rem; cursor: pointer; width: 38px; height: 32px; border-radius: 8px }
.wk, .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 2px }
.wk span { text-align: center; font-size: .68rem; font-weight: 700; color: var(--ink2) }
.wk span:nth-child(n+6) { color: var(--warn) }
.d { aspect-ratio: 1; border: 0; border-radius: 50%; background: transparent; font-size: .92rem; font-variant-numeric: tabular-nums; position: relative; display: grid; place-items: center; padding: 0 }
button.d { cursor: pointer }
.d.we { color: var(--warn) }
.d.today { font-weight: 800; color: var(--accent) }
.d.today::before { content: "oggi"; position: absolute; top: 1px; font-size: .5rem; font-weight: 700 }
.d.dot::after { content: ""; position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--ink2) }
.d.on { background: var(--accent); color: var(--on-accent); font-weight: 800 }
.d.on::after { background: var(--on-accent) }
.d.paused { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
.d.fires { box-shadow: inset 0 0 0 2px var(--accent); font-weight: 800 }
.d.ghost { color: var(--ink2); text-decoration: line-through }
.calnote { font-size: .8rem; color: var(--ink2); padding: 2px 6px 0 }
.calnote b { color: var(--fg) }
.lastday { width: 100%; border: 0; border-radius: 10px; padding: 9px; background: var(--bg); cursor: pointer }
.lastday.sel { background: var(--accent); color: var(--on-accent); font-weight: 700 }

/* notifica di anteprima */
.notif { background: var(--banner); border-radius: 18px; padding: 11px 13px; display: flex; gap: 10px; border: 0.5px solid var(--sep) }
.notif .ap { width: 36px; height: 36px; border-radius: 9px; overflow: hidden; flex: none }
.notif .grow { min-width: 0; flex: 1 }
.notif .t { display: flex; justify-content: space-between; font-size: .75rem; color: var(--ink2) }
.notif b { display: block; font-size: .9rem }
.notif p { margin: 2px 0 0; font-size: .85rem; white-space: pre-line }

/* statistiche */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px 16px; padding: 12px 16px }
.kpis div { display: flex; flex-direction: column; min-width: 0 }
.kpis div:first-child { grid-column: 1 / -1; padding-bottom: 10px; border-bottom: 0.5px solid var(--sep) }
.kpis div:first-child b { font-size: 1.5rem }
.kpis small { font-size: .72rem; color: var(--ink2) }
.kpis b { font-size: 1.05rem; font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.donut { display: flex; gap: 14px; align-items: center; padding: 12px 16px }
.donut svg { width: 116px; height: 116px; flex: none }
.legend { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; font-size: .8rem }
.legend div { display: flex; align-items: center; gap: 6px }
.legend i { width: 8px; height: 8px; border-radius: 50%; flex: none }
.legend span { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.legend em { font-style: normal; color: var(--ink2); font-variant-numeric: tabular-nums }
.chart { padding: 10px 12px 4px }
.chart svg { width: 100%; height: auto; display: block }
.key { display: flex; gap: 14px; font-size: .74rem; color: var(--ink2); padding: 0 16px 10px }
.key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 5px }
.badge { font-size: .72rem; font-weight: 700; padding: 3px 8px; border-radius: 999px; white-space: nowrap; flex: none }
.badge.ok { background: color-mix(in srgb, var(--ok) 15%, transparent); color: var(--ok) }
.badge.mid { background: color-mix(in srgb, var(--warn) 15%, transparent); color: var(--warn) }
.badge.bad { background: color-mix(in srgb, var(--late) 15%, transparent); color: var(--late) }
.hbar { height: 5px; border-radius: 3px; margin-top: 4px }

/* impostazioni */
/* decorazioni dei temi (dietro all'app) */
#deco { position: fixed; left: 0; right: 0; top: 0; height: 100%; height: var(--apph, 100dvh); z-index: 0; pointer-events: none; overflow: hidden; display: none; background: var(--decobg, var(--bg)) }
html.has-deco #deco { display: block }
#app { z-index: 1 }
html.has-deco #app { background: transparent }
html.has-deco #app .group { background: color-mix(in srgb, var(--cell) 84%, transparent) }
html.has-deco .tabbar { background: color-mix(in srgb, var(--cell) 90%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px) }
#deco .p { position: absolute; top: -40px; animation: fall linear infinite; will-change: transform }
#deco .p svg { display: block; width: 100%; height: 100% }
@keyframes fall { from { transform: translate3d(0, 0, 0) rotate(0deg) } to { transform: translate3d(var(--dx, 40px), 115vh, 0) rotate(var(--rot, 360deg)) } }
#deco .star { position: absolute; border-radius: 50%; background: #fff; animation: tw ease-in-out infinite }
@keyframes tw { 0%, 100% { opacity: .2 } 50% { opacity: 1 } }
#deco .shoot { position: absolute; width: 120px; height: 2px; background: linear-gradient(90deg, #fff, transparent); opacity: 0; transform: rotate(-25deg); animation: shoot 9s ease-out infinite }
@keyframes shoot { 0%, 88% { opacity: 0; translate: 0 0 } 90% { opacity: 1 } 100% { opacity: 0; translate: -260px 120px } }
#deco .wave { position: absolute; left: 0; bottom: 0; width: 200%; animation: wave linear infinite }
#deco .wave svg { width: 100%; height: 100%; display: block }
@keyframes wave { to { transform: translateX(-50%) } }
#deco .bub { position: absolute; bottom: -20px; border-radius: 50%; border: 1.5px solid rgb(255 255 255 / .55); animation: bub linear infinite }
@keyframes bub { to { transform: translateY(-110vh) } }
#deco .glow { position: absolute; border-radius: 50%; filter: blur(46px); opacity: .55; animation: drift ease-in-out infinite alternate }
@keyframes drift { from { transform: translate(-8%, 0) scale(1) } to { transform: translate(10%, 6%) scale(1.25) } }
#deco .moon { position: absolute; top: calc(18px + env(safe-area-inset-top, 0px)); right: 22px; width: 54px; height: 54px }
@media (prefers-reduced-motion: reduce) { #deco * { animation: none !important } #deco .p { display: none } }
.themes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; padding: 12px }
.theme { border: 0; background: var(--bg); border-radius: 14px; padding: 12px 4px 9px; display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: .8rem; cursor: pointer }
.theme .sw { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 800; overflow: hidden; position: relative }
.theme .sw svg { position: absolute; inset: 0; width: 100%; height: 100% }
.theme .sw b { position: relative; text-shadow: 0 1px 3px rgb(0 0 0 / .45) }
.iconprev { display: flex; justify-content: space-between; gap: 4px; padding: 2px 16px 14px }
.iconprev .tile { width: 30px; height: 30px; border-radius: 8px }
.swatches { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; padding: 12px 16px 14px; justify-items: center }
.swatches button, .swatches label { width: 36px; height: 36px; border-radius: 50%; border: 0; cursor: pointer; display: grid; place-items: center; color: #fff; font-weight: 800; position: relative }
.swatches .sel { box-shadow: 0 0 0 2px var(--cell), 0 0 0 4px var(--fg) }
.swatches label { background: conic-gradient(#f44, #fd4, #4d6, #4cf, #64f, #f4c, #f44) }
.swatches label input { position: absolute; inset: 0; opacity: 0; width: 100%; height: 100%; cursor: pointer }
.theme.sel { box-shadow: 0 0 0 2px var(--accent); font-weight: 700 }

/* barra schede */
.tabbar { display: flex; border-top: 0.5px solid var(--sep); background: var(--cell); padding: 6px 4px calc(8px + env(safe-area-inset-bottom, 0px)); flex: none }
.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: .64rem; color: var(--ink2); border: 0; background: none; cursor: pointer; padding: 2px 0 }
.tabbar button svg { width: 24px; height: 24px }
.tabbar button.on { color: var(--accent); font-weight: 700 }

/* foglio a schermo intero */
.sheet { position: fixed; inset: 0; background: var(--bg); z-index: 20; display: flex; flex-direction: column; animation: up .25s ease-out }
@keyframes up { from { transform: translateY(30px); opacity: 0 } }
.sheet .bar2 { display: flex; align-items: center; gap: 6px; padding: calc(10px + env(safe-area-inset-top, 0px)) 10px 6px; flex: none }
.sheet .view { padding-bottom: calc(24px + env(safe-area-inset-bottom, 0px)) }
.sheet .bar2 .t { flex: 1; text-align: center; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sheet .bar2 .save { font-weight: 800 }
.sheet .bar2 .save:disabled { opacity: .35 }

.toast { position: fixed; left: 50%; bottom: calc(84px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); font-size: .88rem; padding: 9px 16px; border-radius: 999px; z-index: 40; max-width: calc(100% - 32px); text-align: center }

/* schermata di accesso */
.lock { position: fixed; inset: 0; z-index: 30; display: flex; flex-direction: column; align-items: center; text-align: center; color: #fff; overflow: hidden;
  background: var(--lockbg, linear-gradient(180deg, var(--accent) 0%, color-mix(in srgb, var(--accent) 62%, #000) 58%, #070b0a 100%)) }
.lock .tiles { position: absolute; inset: 0; pointer-events: none; overflow: hidden }
.lock .tiles .tile { position: absolute; bottom: -70px; opacity: .2; animation: floatUp linear infinite }
@keyframes floatUp { from { transform: translateY(0) rotate(-12deg) } to { transform: translateY(-1100px) rotate(12deg) } }
.lock .body { position: relative; flex: 1; width: 100%; display: flex; flex-direction: column; align-items: center; padding: 18vh 28px 36px }
.lock .ai-wrap { position: relative; width: 100px; height: 100px }
.lock .ring { position: absolute; inset: -16px; border-radius: 50%; border: 2px solid rgb(255 255 255 / .55); opacity: 0 }
.lock .ai { width: 100px; height: 100px; border-radius: 23px; overflow: hidden; box-shadow: 0 12px 28px -10px rgb(0 0 0 / .55); transition: transform .35s cubic-bezier(.34, 1.56, .64, 1), box-shadow .35s }
.lock .ai svg { width: 100%; height: 100%; display: block }
.lock h2 { font-size: 1.6rem; font-weight: 800; margin: 22px 0 4px }
.lock .gr { opacity: .85 }
.lock .unlock { margin-top: auto; width: 100%; border: 0; border-radius: 16px; background: #fff; color: var(--accent); font-weight: 800; font-size: 1rem; padding: 15px; cursor: pointer }
.lock .note { font-size: .78rem; opacity: .75; margin-top: 12px }
.lock .err { font-size: .8rem; font-weight: 700; background: rgb(215 55 47 / .8); padding: 5px 12px; border-radius: 999px; margin-bottom: 12px }
.ai .chk { stroke-dasharray: 420; stroke-dashoffset: 0 }
.ai .coin { transform-box: fill-box; transform-origin: center }
.lock.intro .ai { animation: iconIn .7s cubic-bezier(.34, 1.56, .64, 1) both }
.lock.intro .ring { animation: ring 1.6s ease-out .25s both }
.lock.intro .ai .chk { stroke-dashoffset: 420; animation: draw .45s ease-out .35s forwards }
.lock.intro .ai .coin { opacity: 0; animation: coinIn .65s cubic-bezier(.34, 1.56, .64, 1) .6s forwards }
.lock.intro h2 { animation: rise .5s ease-out .45s both }
.lock.intro .gr { animation: rise .5s ease-out .55s both }
.lock.intro .unlock, .lock.intro .note { animation: rise .55s ease-out .7s both }
.lock .pinbox { width: 100%; display: flex; flex-direction: column; align-items: center }
.lock.pinmode .body { padding-top: max(6vh, calc(14px + env(safe-area-inset-top, 0px))) }
.lock.pinmode .ai-wrap { transform: scale(.7); margin: -14px 0 }
.lock.pinmode h2 { margin-top: 8px; font-size: 1.3rem }
.lock .linkbtn { border: 0; background: none; color: #fff; opacity: .85; font-weight: 700; margin-top: 12px; cursor: pointer; font-size: .9rem }
.dots { display: flex; gap: 16px; justify-content: center; margin: 14px 0 18px }
.dots i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid currentColor }
.dots i.f { background: currentColor }
.dots.shake { animation: shake .4s }
@keyframes shake { 20%, 60% { transform: translateX(-10px) } 40%, 80% { transform: translateX(10px) } }
.pad { display: grid; grid-template-columns: repeat(3, min(76px, 21vw)); gap: min(14px, 1.8vh) 22px; justify-content: center }
.pad button { height: min(76px, 9.2vh); aspect-ratio: 1; border-radius: 50%; border: 0; background: rgb(255 255 255 / .2); color: #fff; font-size: 1.7rem; cursor: pointer; justify-self: center }
.pad button.ghost { background: none; font-size: 1rem; font-weight: 700 }
.pad button:active { background: rgb(255 255 255 / .4) }
.pinsheet { display: flex; flex-direction: column; align-items: center; padding-top: 18px; color: var(--accent) }
.pinsheet .ptitle { color: var(--fg); font-weight: 700; font-size: 1.1rem; text-align: center }
.pinsheet .psub { color: var(--ink2); font-size: .85rem; text-align: center; margin-top: 4px; min-height: 1.2em }
.pinsheet .pad button { background: var(--cell); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08) }
.pinsheet .pad button.ghost { background: none; box-shadow: none; color: var(--accent) }
.lock.success .ai { transform: scale(1.12); box-shadow: 0 0 44px rgb(255 255 255 / .65) }
.lock.opening { animation: openUp .55s ease-in forwards }
@keyframes iconIn { from { transform: scale(.55); opacity: 0 } }
@keyframes ring { from { transform: scale(.9); opacity: .8 } to { transform: scale(2); opacity: 0 } }
@keyframes draw { to { stroke-dashoffset: 0 } }
@keyframes coinIn { from { transform: scale(.2) rotateY(200deg); opacity: 0 } to { transform: none; opacity: 1 } }
@keyframes rise { from { opacity: 0; transform: translateY(18px) } }
@keyframes openUp { to { opacity: 0; transform: scale(1.18); visibility: hidden } }
@media (prefers-reduced-motion: reduce) {
  .lock.intro *, .sheet { animation: none !important } .lock.intro .ai .chk { stroke-dashoffset: 0 } .lock.intro .ai .coin { opacity: 1 }
  .lock .tiles { display: none } .switch, .switch::after { transition: none }
}

/* Proporzioni su tutti i dispositivi */
:root { --col: 600px; --sl: max(16px, env(safe-area-inset-left, 0px), calc((100vw - var(--col)) / 2)); --sr: max(16px, env(safe-area-inset-right, 0px), calc((100vw - var(--col)) / 2)) }
input, select, textarea { font-size: 16px !important } /* sotto 16px Safari ingrandisce la pagina quando tocchi un campo */
.tabbar { padding: 6px calc(var(--sr) - 12px) max(6px, env(safe-area-inset-bottom, 0px)) calc(var(--sl) - 12px) }
/* iPhone dalla Home: niente striscia di colore diverso sotto la barra delle schede */
html { background: linear-gradient(var(--bg) 50%, var(--cell) 50%) fixed }
body { background: transparent }
#app { bottom: auto; height: 100%; height: 100dvh; height: var(--apph, 100dvh); background: var(--bg) }
/* Dalla Home dell'iPhone, iOS calcola l'altezza senza la barra di stato: l'app usa l'altezza vera dello schermo */
html.ios-pwa, html.ios-pwa body { height: var(--apph, 100%) }
/* riempie comunque l'eventuale spazio sotto la barra delle schede e sotto i fogli */
.tabbar { position: relative }
.tabbar::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 200px; background: var(--cell); pointer-events: none }
.sheet::after { content: ""; position: absolute; left: 0; right: 0; top: 100%; height: 200px; background: var(--bg); pointer-events: none }
.sheet, .lock { bottom: auto; height: 100%; height: 100dvh; height: var(--apph, 100dvh) }
.sheet .bar2 { padding-left: max(10px, calc(var(--sl) - 6px)); padding-right: max(10px, calc(var(--sr) - 6px)) }
@media (min-width: 390px) { html, body { font-size: 16px } }
@media (max-width: 359px) { html, body { font-size: 14px } }
@media (min-width: 700px) { :root { --col: 640px } html, body { font-size: 17px } .tabbar button { font-size: .7rem } }
@media (orientation: landscape) and (max-height: 500px) { .top { padding-top: calc(6px + env(safe-area-inset-top, 0px)) } .top h1 { font-size: 1.4rem } }
</style>
</head>

}

  const out = [];

function dueDate(sub, y, m) {

function notifActions(subs, y, m) {
  const owed = new Map(), key = mkey(y, m);
  for (const p of peopleFor(y, m)) for (const i of p.items) if (subs.includes(i.sub) && !i.paid) {
    const o = owed.get(p.key) || { name: p.name, sum: 0, items: [] };
    o.sum += i.share; o.items.push({ s: i.sub.id, m: key, p: p.key, a: i.share }); owed.set(p.key, o);
  }
  const ranked = [...owed.values()].sort((a, b) => b.sum - a.sum);
  const actions = ranked.slice(0, 2).map((o) => ({ title: `${o.name} ha pagato`, items: o.items }));
  if (ranked.length > 1) actions.push({ title: "Hanno pagato tutti", items: ranked.flatMap((o) => o.items) });
  return actions;
}
function buildSchedule() {
  const list = [], n = now(), fu = S.settings.fu || 0;
  // promemoria
  for (const r of S.reminders.filter((x) => x.on)) {
    const subs = subsOf(r); if (!subs.length) continue;
    for (const o of nextWithMonth(r, 3)) {
      const t = notificationText(subs, o.y, o.m); if (!t) continue;
      let body = t.body;
      const last = lastOcc(r);
      if (r.rep === "mese" && last && sameDay(last, o.date)) body += "\nÈ l'ultimo promemoria: l'abbonamento sta per scadere.";
      list.push({ at: +o.date, title: r.label || t.title, body, actions: notifActions(subs, o.y, o.m) });
    }
  }
  // solleciti: un mese alla volta, solo chi non ha ancora pagato
  if (fu > 0) {
    const months = new Map();
    for (const r of S.reminders.filter((x) => x.on)) for (let k = -1; k <= 2; k++) {
      const b = new Date(n.getFullYear(), n.getMonth() + k, 1), d = belonging(r, b.getFullYear(), b.getMonth());
      if (!d) continue;
      const f = new Date(d.getFullYear(), d.getMonth(), d.getDate() + fu, d.getHours(), d.getMinutes());
      if (f <= n) continue;
      const mk = mkey(b.getFullYear(), b.getMonth()), e = months.get(mk) || { at: f, y: b.getFullYear(), m: b.getMonth(), subs: new Set() };
      if (f < e.at) e.at = f; subsOf(r).forEach((s) => e.subs.add(s)); months.set(mk, e);
    }
    for (const e of months.values()) {
      const unpaid = peopleFor(e.y, e.m).map((p) => ({ p, items: p.items.filter((i) => !i.paid && e.subs.has(i.sub)) })).filter((x) => x.items.length);
      if (!unpaid.length) continue;
      const tot = unpaid.reduce((a, x) => a + x.items.reduce((b, i) => b + i.share, 0), 0);
      list.push({ at: +e.at, title: `Ancora da incassare: ${chf(tot)}`,
        body: unpaid.map((x) => `${x.p.name}: ${chf(x.items.reduce((b, i) => b + i.share, 0))} (${x.items.map((i) => i.sub.name).join(", ")})`).join("\n") + "\nTocca per mandare un sollecito.",
        actions: notifActions([...e.subs], e.y, e.m) });
    }
  }
  // rinnovi e prove gratuite
  for (const s of S.subs) {
    const price = `${chf(terms(s, keyOf(n)).total)} ${PER[s.cycle || 1]}`;
    if (inTrial(s)) {
      const end = new Date(s.trialEnd), at = new Date(end.getFullYear(), end.getMonth(), end.getDate() - Math.max(1, s.alertDays || 3), 9);
      if (at > n) list.push({ at: +at, title: `La prova di ${s.name} finisce ${fmtShort(end)}`, body: `Dopo costerà ${price}. Se non ti interessa, disdici prima di quella data.`, actions: [] });
      continue;
    }
    if (!s.renewalAlert) continue;
    let from = n;
    for (let k = 0; k < 2; k++) {
      const c = nextCharge(s, from); if (!c) break;
      from = new Date(c.getFullYear(), c.getMonth(), c.getDate() + 1);
      const at = alertDate(c, s.notice, s.alertDays || 3), dl = cancelDeadline(c, s.notice);
      if (at > n) list.push({ at: +at, title: `${s.name} si rinnova ${fmtShort(c)}`,
        body: s.notice ? `Costo ${price}. Per disdire hai tempo fino a ${fmtDate(dl)} (preavviso di ${s.notice} giorni).` : `Costo ${price}. Se vuoi disdire, fallo entro ${fmtDate(dl)}.`, actions: [] });
    }
  }
  return list.filter((x) => x.at > +n).sort((a, b) => a.at - b.at).slice(0, 60);
}

const expandedPast = new Set();
function renderMonth(v) {
  const { y, m } = view, key = mkey(y, m);
  setTop(`${cap(MONTHS[m])} ${y}`,
    topBtn("‹", () => { const d = new Date(y, m - 1, 1); view.y = d.getFullYear(); view.m = d.getMonth(); render(); }, true, "Mese precedente"),
    topBtn("Oggi", () => { view.y = now().getFullYear(); view.m = now().getMonth(); render(); }),
    topBtn("›", () => { const d = new Date(y, m + 1, 1); view.y = d.getFullYear(); view.m = d.getMonth(); render(); }, true, "Mese successivo"));
  homeHint(v);
  if (!S.subs.length) {
    emptyState(v, "Benvenuto!", "Aggiungi gli abbonamenti che dividi con altre persone: l'app ti ricorda chi deve pagare e quanto.",
      [["Aggiungi il primo abbonamento", () => { tab = "abbonamenti"; render(); editSub(null); }], ["Prova con dati di esempio", loadSample, true]]);
    return;
  }
  const people = peopleFor(y, m);
  const arr = arrearsBefore(y, m);
  for (const [pk, a] of arr) if (!people.some((p) => p.key === pk)) people.push({ key: pk, name: a.name, items: [] });
  people.sort((a, b) => a.name.localeCompare(b.name));
  const pastTotal = [...arr.values()].reduce((a, x) => a + x.items.reduce((b, i) => b + i.share, 0), 0);
  const all = people.flatMap((p) => p.items);
  const total = all.reduce((a, i) => a + i.share, 0), paid = all.filter((i) => i.paid).reduce((a, i) => a + i.share, 0);
  const lateCount = people.filter((p) => p.items.some((i) => i.late > 0) || arr.has(p.key)).length;
  const sum = el("div", "group");
  sum.innerHTML = `<div class="stats"><div><small>Da incassare</small><b>${chf(total)}</b></div><div><small>Incassato</small><b style="color:var(--ok)">${chf(paid)}</b></div><div><small>Mancante</small><b style="color:var(--warn)">${chf(total - paid)}</b></div></div>
    <div class="bar"><i style="width:${total ? paid / total * 100 : 0}%"></i></div>${lateCount ? `<div class="latebar">${lateCount === 1 ? "1 persona è in ritardo" : lateCount + " persone sono in ritardo"}${pastTotal ? ` · ${chf(pastTotal)} dai mesi passati` : ""}</div>` : ""}`;
  v.append(sum);
  if (!people.length) { v.append(el("div", "secfoot", "Questo mese nessuno deve pagare niente.")); return; }

  for (const p of people) {
    const past = arr.has(p.key) ? arr.get(p.key).items : [];
    const owed = p.items.filter((i) => !i.paid), owedSum = owed.reduce((a, i) => a + i.share, 0) + past.reduce((a, i) => a + i.share, 0), late = Math.max(0, ...owed.map((i) => i.late), ...past.map((i) => i.late));
    const head = el("div", "sechead"); head.append(el("span", null, p.name));
    head.append(el("span", "st " + (!owedSum ? "ok" : late ? "late" : "due"), !owedSum ? "Pagato" : past.length ? `${past.length} ${past.length === 1 ? "mese arretrato" : "mesi arretrati"} · ${chf(owedSum)}` : late ? `in ritardo di ${late} ${late === 1 ? "giorno" : "giorni"} · ${chf(owedSum)}` : `Deve ${chf(owedSum)}`));
    v.append(head);
    const g = el("div", "group");
    for (const it of p.items) {
      const row = el("div", "row");
      const ck = el("button", "ck" + (it.paid ? " on" : ""), it.paid ? "✓" : "");
      ck.setAttribute("role", "checkbox"); ck.setAttribute("aria-checked", !!it.paid); ck.setAttribute("aria-label", `${it.sub.name} pagato`);
      ck.addEventListener("click", () => { setPaid(y, m, it.sub, p.key, it.share, !it.paid); if (A && A.vibrate) A.vibrate(); save(); render(); });
      const gr = el("div", "grow");
      gr.append(el("div", it.paid ? "paidname" : null, it.sub.name));
      if (it.paid) gr.append(el("div", "sub ok", `Pagato il ${fmtShort(new Date(it.paid.on))}`));
      else if (it.late) gr.append(el("div", "sub late", `Scaduto il ${fmtShort(it.due)} · in ritardo di ${it.late} ${it.late === 1 ? "giorno" : "giorni"}`));
      else gr.append(el("div", "sub", `Da pagare entro ${fmtShort(it.due)}`));
      if ((it.sub.cycle || 1) > 1) gr.append(el("div", "sub", it.sub.split === "rate" ? `Rata mensile (si paga ${PER[it.sub.cycle]})` : "Rinnovo: quota intera"));
      const nk = keyOf(new Date(y, m + 1, 1)), h = (it.sub.history || []).find((c) => c.from === nk);
      if (h) { const ns = h.members.find((x) => personKey(x.name) === p.key); const nv = ns ? dueShare(it.sub, ns.share, (m + 1) % 12 + 1) : 0; if (Math.abs(nv - it.share) > .004 && !it.paid) gr.append(el("div", "change", `Da ${MONTHS[(m + 1) % 12]}: ${chf(nv)} (nuovo prezzo)`)); }
      const t = el("span"); t.innerHTML = tile(it.sub.cat);
      row.append(ck, t.firstChild, gr, el("span", "amt" + (it.paid ? " paid" : ""), chf(it.share)));
      g.append(row);

    if (past.length) {

      dr.addEventListener("click", () => { if (open) expandedPast.delete(p.key); else expandedPast.add(p.key); render(); });

        ck.setAttribute("role", "checkbox"); ck.setAttribute("aria-checked", "false"); ck.setAttribute("aria-label", `${it.sub.name} di ${MONTHS[it.m]} pagato`);
        ck.addEventListener("click", () => { setPaid(it.y, it.m, it.sub, p.key, it.share, true); if (A && A.vibrate) A.vibrate(); save(); render(); toast(`${p.name}: ${it.sub.name} di ${MONTHS[it.m]} pagato`); });

        gr.append(el("div", null, `${it.sub.name} · ${MONTHS[it.m]}${it.y !== y ? " " + it.y : ""}`));
        gr.append(el("div", "sub late", `Scaduto il ${fmtShort(it.due)} · in ritardo di ${it.late} ${it.late === 1 ? "giorno" : "giorni"}`));
        const t = el("span"); t.innerHTML = tile(it.sub.cat);
        row.append(ck, t.firstChild, gr, el("span", "amt", chf(it.share)));

      const text = messageFor(p, owed, y, m, past), phone = S.contacts[p.key] || "";
      const acts = el("div", "acts");
      const wa = el("button", "act", "WhatsApp"); wa.addEventListener("click", () => openUrl(`https://wa.me/${intlDigits(phone)}?text=${encodeURIComponent(text)}`));
      const sms = el("button", "act", "SMS"); sms.addEventListener("click", () => openUrl(`sms:${phone ? "+" + intlDigits(phone) : ""}${IS_IOS ? "&" : "?"}body=${encodeURIComponent(text)}`));
      const cp = el("button", "act", "Copia"); cp.addEventListener("click", () => copyText(text));
      acts.append(wa, sms, cp); g.append(acts);
      const allRow = el("div", "row tap"); allRow.append(el("span", "grow link", "Segna tutto pagato"));
      if (past.length) allRow.firstChild.textContent = `Segna tutto pagato (${chf(owedSum)})`;
      allRow.addEventListener("click", () => { owed.forEach((i) => setPaid(y, m, i.sub, p.key, i.share, true)); past.forEach((i) => setPaid(i.y, i.m, i.sub, p.key, i.share, true)); save(); render(); toast(`${p.name} ha pagato tutto`); });
      g.append(allRow);
    }
    const pr = el("div", "row");
    const lab = el("label", null, "Numero"); lab.htmlFor = "ph-" + p.key;
    const inp = el("input", "in link"); inp.type = "tel"; inp.id = "ph-" + p.key; inp.placeholder = `Aggiungi il numero di ${p.name}`; inp.value = S.contacts[p.key] || ""; inp.inputMode = "tel";
    inp.addEventListener("change", () => { const vv = inp.value.trim(); if (vv) S.contacts[p.key] = vv; else delete S.contacts[p.key]; save(); render(); });
    pr.append(lab, inp); g.append(pr);
    v.append(g);
  }
}

function renderSubs(v) {
  setTop("Abbonamenti", topBtn("+", () => editSub(null), true, "Nuovo abbonamento"));
  if (!S.subs.length) { emptyState(v, "Nessun abbonamento", "Aggiungi Spotify, Netflix o qualsiasi abbonamento che dividi.", [["Aggiungi abbonamento", () => editSub(null)], ["Prova con dati di esempio", loadSample, true]]); return; }
  const g = el("div", "group"); let tot = 0, mine = 0; const k = keyOf(now());
  for (const s of [...S.subs].sort((a, b) => a.name.localeCompare(b.name))) {
    const t = terms(s, k), my = myShareOf(t); tot += monthly(s, t.total); mine += monthly(s, my);
    const row = el("div", "row tap"); const tl = el("span"); tl.innerHTML = tile(s.cat);
    const gr = el("div", "grow");
    gr.append(el("div", null, s.name)); gr.firstChild.style.fontWeight = "700";
    gr.append(el("div", "sub", t.members.length ? `Con ${t.members.map((x) => x.name).join(", ")} · tua quota ${chf(my)}` : "Solo tu"));
    if ((s.cycle || 1) > 1) {
      const rn = (() => { for (let i = 0; i < 13; i++) { const d = new Date(now().getFullYear(), now().getMonth() + i, 1); if (isRenewal(s, d.getMonth() + 1)) return MONTHS[d.getMonth()]; } return ""; })();
      gr.append(el("div", "sub", s.split === "rate" ? `≈ ${chf(monthly(s, t.total))} al mese · rate mensili · rinnovo a ${rn}` : `Si chiede tutto al rinnovo · ${rn}`));
    }
    if (inTrial(s)) gr.append(el("div", "change", `Prova gratuita fino a ${fmtShort(new Date(s.trialEnd))}`));
    else if (s.renewalAlert) { const c = nextCharge(s); if (c) gr.append(el("div", "sub", `Rinnovo ${fmtShort(c)} · avviso ${fmtShort(alertDate(c, s.notice, s.alertDays || 3))}`)); }
    const fut = (s.history || []).filter((c) => c.from > k).sort((a, b) => (a.from < b.from ? -1 : 1))[0];
    if (fut) gr.append(el("div", "change", `Da ${MONTHS[+fut.from.slice(5) - 1]} ${fut.from.slice(0, 4)}: ${chf(fut.total)}`));
    const right = el("div", "amt"); right.append(el("span", null, chf(t.total))); if ((s.cycle || 1) > 1) right.append(el("span", "per", PER[s.cycle]));
    row.append(tl.firstChild, gr, right);

  }
  v.append(g, el("div", "secfoot", `Totale ≈ ${chf(tot)} al mese. La tua parte: ≈ ${chf(mine)} al mese, ${chf(mine * 12)} all'anno.`));
}

}

  const k = keyOf(now()); let mine = 0, all = 0; const byCat = new Map();

  const lg = el("div", "legend"); for (const [c, val] of slices) lg.insertAdjacentHTML("beforeend", `<div><i style="background:${CATS[c].color}"></i><span>${CATS[c].name}</span><em>${chf(val)}</em></div>`);

  const maxV = Math.max(...data.map((d) => d.paid + d.miss), 1), step = maxV > 160 ? 80 : maxV > 80 ? 40 : 20, top = Math.ceil(maxV / step) * step;

  data.forEach((d, i) => { const x = L + i * bw + bw * .2, w = bw * .6, hp = d.paid / top * (H - B - T), hm = d.miss / top * (H - B - T), base = H - B;

// ---------- calendario (promemoria) ----------

  nx.addEventListener("click", () => { const d = new Date(y, m + 1, 1); cv.y = d.getFullYear(); cv.m = d.getMonth(); opts.redraw(); });
  head.append(pv, el("b", null, `${cap(MONTHS[m])} ${y}`), nx);

  if (opts.extra) opts.extra(wrap);
  container.append(wrap);
}
