name: App iPhone

on:
  push:
    branches: [main, claude/ios-native]
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    name: Compila l'app e prepara l'IPA
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app 2>/dev/null || true
          xcodebuild -version

      - name: Genera il progetto
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Test della logica (simulatore)
        working-directory: ios
        run: |
          set -o pipefail
          SIM=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k,v in sorted(d.items(), reverse=True) if 'iOS' in k for x in v if x['name'].startswith('iPhone')))")
          xcodebuild test -project QuoteAbbonamenti.xcodeproj -scheme QuoteAbbonamenti -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO 2>&1 | tee test.log | xcbeautify --renderer github-actions

      - name: Compila per iPhone (senza firma)
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build -project QuoteAbbonamenti.xcodeproj -scheme QuoteAbbonamenti -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} 2>&1 | tee build.log | xcbeautify --renderer github-actions
          mkdir -p Payload
          cp -R build/Release-iphoneos/QuoteAbbonamenti.app Payload/
          zip -qry QuoteAbbonamenti.ipa Payload
          ls -la QuoteAbbonamenti.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: QuoteAbbonamenti-ipa
          path: ios/QuoteAbbonamenti.ipa

      - name: Pubblica l'IPA (release "iphone")
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete iphone --yes --cleanup-tag 2>/dev/null || true
          gh release create iphone ios/QuoteAbbonamenti.ipa --title "App iPhone (build ${{ github.run_number }})" \
            --notes "App nativa per iPhone, da installare con Sideloadly o AltStore. Compilata da ${{ github.sha }}." --latest=false

      - name: Log (in caso di errore)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-log
          path: |
            ios/test.log
            ios/build.log
